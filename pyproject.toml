[project]
name = "langfuse-workshop"
version = "1.3.0"
description = "Hands-on Langfuse workshop: trace, score and debug a SQL analytics agent."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "langfuse>=5.2,<6",
    "openai>=2",
]

[project.scripts]
kit = "kit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
